center;justify-content:space-between}.event.school{border-color:#a39af4}.event.gym{border-color:#5ddac0}.event.personal{border-color:#ffbe8c}.event b{font-size:12px;font-weight:600}.event small{color:var(--muted);white-space:nowrap;direction:ltr}.mood-buttons{display:flex;gap:7px;flex-wrap:wrap}.mood-buttons button{background:var(--surface2);border:1px solid var(--stroke);color:var(--text);border-radius:12px;padding:8px 14px;font-size:13px}.mood-buttons button.selected{border-color:var(--purple);background:var(--purpleSoft);color:var(--purple)}.notice{padding:11px 13px;border-radius:12px;font-size:12px;background:#ffbe8c13;border:1px solid #ffbe8c37;color:var(--orange);margin:10px 0}.notice.neutral{background:var(--purpleSoft);border-color:transparent;color:var(--text)}.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:18px}.toolbar input{max-width:280px;flex:1}.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{border:1px solid var(--stroke);border-radius:11px;padding:9px 12px;background:var(--surface);color:var(--muted)}.tabs button.active{background:var(--purpleSoft);color:var(--purple);border-color:var(--purple)}.task-list{display:grid;gap:9px}.task-card{background:var(--surface);border:1px solid var(--stroke);border-radius:14px;padding:13px 15px}.task-card .task-row{padding:2px 0;border:0}.week-grid{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:9px;overflow-x:auto;padding-bottom:12px}.day-col{background:var(--surface);border:1px solid var(--stroke);border-radius:16px;padding:12px;min-height:220px;min-width:145px}.day-col.current{border-color:var(--purple);background:linear-gradient(180deg,var(--purpleSoft),var(--surface) 80px)}.dayhead{display:flex;justify-content:space-between;gap:5px;margin-bottom:12px;align-items:center}.dayhead b{font-size:12px}.dayhead small{color:var(--muted)}.calendar-item{padding:8px 9px;margin:7px 0;border-radius:10px;background:var(--surface2);border-right:3px solid #777fc8;font-size:11px;cursor:pointer;overflow-wrap:anywhere}.calendar-item.eventitem{border-color:var(--teal)}.calendar-item.dueitem{border-color:var(--orange)}.calendar-item.doneitem{opacity:.57}.calendar-item:hover{filter:brightness(1.12)}.calendar-item small{display:block;color:var(--muted)}.add-day{width:100%;border:1px dashed var(--stroke);background:transparent;color:var(--muted);border-radius:9px;padding:5px;margin-top:9px}.add-day:hover{color:var(--purple);border-color:var(--purple)}.barline{display:flex;gap:10px;align-items:center;margin:12px 0}.barline .track{background:var(--surface3);height:10px;flex:1;border-radius:20px;overflow:hidden}.barline .fill{background:linear-gradient(90deg,#746be0,#a295ff);height:100%;border-radius:20px}.barline .dayname{width:66px;font-size:12px}.barline .count{width:35px;text-align:left;font-size:11px;color:var(--muted)}.progress-detail{display:grid;grid-template-columns:1fr 1fr;gap:14px}.empty-hint{font-size:12px;color:var(--muted);padding-top:6px}.settings-grid{display:grid;gap:16px;max-width:810px}.rowline{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.full{grid-column:1/-1}.check-row{display:flex;align-items:center;gap:8px}.multi-days{display:flex;gap:5px;flex-wrap:wrap}.multi-days label{display:flex;align-items:center;gap:5px;background:var(--surface2);border:1px solid var(--stroke);border-radius:9px;padding:7px;margin:0;cursor:pointer}.multi-days input{width:15px;height:15px}.modal-wrap{position:fixed;inset:0;background:#030613bb;z-index:20;display:flex;align-items:center;justify-content:center;padding:15px;backdrop-filter:blur(5px)}.modal{background:var(--surface);border:1px solid var(--stroke);border-radius:23px;padding:24px;width:min(620px,100%);max-height:calc(100vh - 30px);overflow-y:auto;box-shadow:var(--shadow)}.modal h2{margin:0;font-size:19px}.modal .foot{display:flex;justify-content:space-between;margin-top:20px;gap:8px;flex-wrap:wrap}.form-group{min-width:0}.bottom-nav{display:none}.toast{position:fixed;bottom:25px;left:25px;padding:11px 16px;border-radius:12px;background:#38394f;color:#fff;z-index:35;box-shadow:var(--shadow);max-width:330px;display:none}.toast.show{display:block}.switch{display:flex;align-items:center;gap:8px}.hint{font-size:11px;color:var(--muted);line-height:1.8}.divider{height:1px;background:var(--stroke);margin:15px 0}.due-alert{background:rgba(255,143,163,.11);border-color:#c368744f}.due-alert .tag{color:var(--red)}.footnote{text-align:center;color:var(--muted);font-size:11px;margin-top:25px}

<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="logo">✦</div><div><h1>Momentum</h1><small>فضای پیشرفت تو</small></div></div>
    <nav id="desktopNav" class="nav"></nav>
    <div class="sidebar-foot" id="sidebarProgress"></div>
  </aside>
  <main class="main"><header class="topbar"><div><div class="eyebrow" id="dateBadge"></div><h1 class="heading" id="pageHeading">داشبورد</h1></div><div class="actions"><span class="tag" id="storageStatus">ذخیره روی دستگاه</span><button class="btn btn-primary" id="quickAdd">＋ تسک جدید</button></div></header><div id="content"></div><div class="footnote">Momentum · برنامه‌ریزی انعطاف‌پذیر، بدون جریمه برای استراحت</div></main>
</div>
<nav class="bottom-nav" id="mobileNav"></nav>
<div id="modalRoot"></div><div class="toast" id="toast"></div>
<script>
'use strict';
const DBKEY='momentum_student_v1', CFGKEY='momentum_sync_config_v1';
const DOW=['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'];
const SATWEEK=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
const VIEWS=[['dashboard','داشبورد','◫'],['planner','برنامهٔ هفتگی','▦'],['tasks','تسک‌ها','☑'],['progress','پیشرفت','◉'],['settings','تنظیمات','⚙']];
const PERSIAN=new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
const PERSIAN_PARTS=new Intl.DateTimeFormat('en-US-u-ca-persian',{year:'numeric',month:'2-digit',day:'2-digit'});
const fnum=n=>String(n??'').replace(/[0-9]/g,c=>'۰۱۲۳۴۵۶۷۸۹'[c]);
const ennum=n=>String(n??'').replace(/[۰-۹]/g,c=>String('۰۱۲۳۴۵۶۷۸۹'.indexOf(c))).replace(/[٠-٩]/g,c=>String('٠١٢٣٤٥٦٧٨٩'.indexOf(c)));
const htmlEscape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isoDate=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const fromIso=s=>{const m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?new Date(+m[1],+m[2]-1,+m[3],12):new Date();};
const today=()=>isoDate(new Date());
const addDays=(iso,n)=>{const d=fromIso(iso);d.setDate(d.getDate()+n);return isoDate(d)};
const shiftWeek=iso=>{const d=fromIso(iso);d.setDate(d.getDate()-((d.getDay()+1)%7));return isoDate(d)};
const persianParts=d=>{const p=Object.fromEntries(PERSIAN_PARTS.formatToParts(d).filter(x=>x.type!=='literal').map(x=>[x.type,+x.value]));return {y:p.year,m:p.month,d:p.day}};
function jalaliToISO(s){if(!s)return '';const digits=ennum(s).replace(/[-.]/g,'/').trim();const m=digits.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/);if(!m)return null;const [y,mo,day]=m.slice(1).map(Number);if(y<1200||y>1600||mo<1||mo>12||day<1||day>31)return null;const st=new Date(y+621,2,17,12);let found=null;for(let i=0;i<10;i++){const q=new Date(st);q.setDate(st.getDate()+i);const p=persianParts(q);if(p.y===y&&p.m===1&&p.d===1){found=q;break}}if(!found)return null;const offset=(mo<=7?(mo-1)*31:186+(mo-7)*30)+day-1;found.setDate(found.getDate()+offset);const z=persianParts(found);return z.y===y&&z.m===mo&&z.d===day?isoDate(found):null}
function isoToJalali(s){if(!s)return '';const p=persianParts(fromIso(s));return fnum(`${p.y}/${String(p.m).padStart(2,'0')}/${String(p.d).padStart(2,'0')}`)}
const shortDate=s=>s?isoToJalali(s).slice(5):'بدون تاریخ';
const longDate=s=>PERSIAN.format(fromIso(s));
const dayName=s=>DOW[fromIso(s).getDay()];
const uid=()=>crypto?.randomUUID?.()||'id'+Date.now().toString(36)+Math.random().toString(36).slice(2);
const mkTask=(title,category,type='once',duration=0,extra={})=>({id:uid(),title,category,type,duration,repeatDays:[],due:'',planned:'',priority:'normal',notes:'',xp:20,...extra});
const mkEvent=(title,day,start,end,kind='school')=>({id:uid(),title,days:[day],start,end,kind,notes:''});
function defaultData(){
 return {version:1,tasks:[],events:[],completions:{},checkins:{},lastModified:Date.now(),pristine:true,theme:'dark',createdOn:today()};
}
function normalize(data){if(!data||!Array.isArray(data.tasks)||!Array.isArray(data.events))throw Error('فایل داده معتبر نیست');return {...data,version:1,completions:data.completions||{},checkins:data.checkins||{},lastModified:data.lastModified||Date.now(),theme:data.theme||'dark'};}
function load(){try{const obj=JSON.parse(localStorage.getItem(DBKEY));return obj?normalize(obj):defaultData()}catch(e){console.warn(e);return defaultData()}}
let data=load(), view='dashboard', selectedDate=today(), weekBase=shiftWeek(selectedDate), taskFilter='all', search='', activeModal=null, draftDate='', cloud=null, sb=null, cloudReady=false, cloudSyncOk=false, syncTimer=null, busySync=false;
let syncConf=(()=>{try{return JSON.parse(localStorage.getItem(CFGKEY))||{}}catch{return {}}})();
const store=()=>{data.lastModified=Date.now();data.pristine=false;localStorage.setItem(DBKEY,JSON.stringify(data));cloudSyncOk=false;if(cloudReady)scheduleUpload();refreshStorageBadge()};
function storageLabel(){return cloudReady?(cloudSyncOk?'☁ روی ابر ذخیره شد':'⟳ ذخیرهٔ محلی؛ در انتظار همگام‌سازی'):syncConf.url?'☁ برای همگام‌سازی وارد شو':'ذخیره روی این دستگاه'}
function refreshStorageBadge(){const el=document.getElementById('storageStatus');if(el)el.textContent=storageLabel()}

const isDone=(t,date=selectedDate)=>!!data.completions[t.id+'|'+(t.type==='once'?'once':date)];
function setDone(t,date,checked){const k=t.id+'|'+(t.type==='once'?'once':date);if(checked)data.completions[k]={at:Date.now(),xp:Number(t.xp)||20};else delete data.completions[k];store();render()}
const appearsOn=(t,date)=>t.type==='daily'||(t.type==='weekly'&&t.repeatDays.includes(fromIso(date).getDay()))||(t.type==='once'&&t.planned===date);
const dailyTasks=date=>data.tasks.filter(t=>appearsOn(t,date)).sort((a,b)=>['urgent','high','normal','low'].indexOf(a.priority)-['urgent','high','normal','low'].indexOf(b.priority));
const dayEvents=date=>data.events.filter(e=>e.days.includes(fromIso(date).getDay())).sort((a,b)=>a.start.localeCompare(b.start));
const dueTasks=date=>data.tasks.filter(t=>t.type==='once'&&!isDone(t,date)&&t.due&&t.due<=addDays(date,7)).sort((a,b)=>a.due.localeCompare(b.due));
const xpTotal=()=>Object.values(data.completions).reduce((sum,x)=>sum+(Number(x.xp)||0),0);
const level=()=>Math.floor(xpTotal()/200)+1;
const xpIntoLevel=()=>xpTotal()%200;
const badgePriority=p=>({urgent:'فوری',high:'مهم',normal:'عادی',low:'کم‌اولویت'}[p]||'عادی');
const niceCategory=c=>htmlEscape(c||'سایر');
const niceDate=s=>s?longDate(s):'نامشخص';
const formatTime=t=>fnum(t||'');
const countDone=(date)=>dailyTasks(date).filter(t=>isDone(t,date)).length;
function iconNav(v){return VIEWS.map(([id,name,icon])=>`<button data-view="${id}" class="${view===id?'active':''}"><span class="navicon">${icon}</span><span>${name}</span></button>`).join('')}
function render(){document.body.classList.toggle('light',data.theme==='light');document.getElementById('desktopNav').innerHTML=iconNav();document.getElementById('mobileNav').innerHTML=iconNav();document.getElementById('pageHeading').textContent=VIEWS.find(v=>v[0]===view)[1];document.getElementById('dateBadge').textContent=longDate(today());refreshStorageBadge();document.getElementById('sidebarProgress').innerHTML=`<small class="muted">پیشرفت شخصیتت</small><div class="rowline"><strong>Level ${fnum(level())}</strong><b>${fnum(xpTotal())} XP</b></div><div class="meter"><span style="width:${xpIntoLevel()/2}%"></span></div><small class="muted">${fnum(200-xpIntoLevel())} XP تا مرحلهٔ بعد</small>`;
 const container=document.getElementById('content');container.innerHTML=({dashboard:renderDashboard,planner:renderPlanner,tasks:renderTasks,progress:renderProgress,settings:renderSettings}[view])();
}
function renderTaskRow(t,date=selectedDate){let done=isDone(t,date),due=t.due?`<span class="tag ${t.due<today()&&!done?'red':t.due===today()?'orange':''}">ددلاین ${shortDate(t.due)}</span>`:'';

function renderEvent(e){return `<div class="event ${e.kind}"><b>${htmlEscape(e.title)}</b><small>${formatTime(e.start)} – ${formatTime(e.end)}</small></div>`}
function overlapAlert(date){const e=dayEvents(date),warnings=[];for(let i=1;i<e.length;i++){if(e[i].start<e[i-1].end)warnings.push(`تداخل «${e[i-1].title}» و «${e[i].title}»`);else if(e[i].start===e[i-1].end&&e[i].kind!==e[i-1].kind)warnings.push(`«${e[i-1].title}» و «${e[i].title}» بدون فاصله هستند`)}return warnings}
function renderDashboard(){const todayTasks=dailyTasks(selectedDate),done=countDone(selectedDate),pct=todayTasks.length?Math.round(done/todayTasks.length*100):0,events=dayEvents(selectedDate),due=dueTasks(selectedDate);
let mood=data.checkins[selectedDate]||{};
return `<section class="grid2"><div class="gap"><div class="card intro"><div class="eyebrow" style="color:#c6c0fa">یک قدم کوچک هم پیشرفت است</div><h2>${selectedDate===today()?'برنامهٔ امروزت':htmlEscape(dayName(selectedDate))+'، '+shortDate(selectedDate)}</h2><p>کارهای مهم را انجام بده؛ لازم نیست تمام روز پُر باشد.</p><div class="intro-bottom"><div class="ring" style="background:conic-gradient(#a99fff ${pct}%,#494765 ${pct}%)"><div>${fnum(pct)}٪</div></div><div class="stat"><b>${fnum(done)} از ${fnum(todayTasks.length)}</b><span>مأموریت‌های برنامه‌ریزی‌شده</span></div><div class="stat"><b>${fnum(todayTasks.filter(t=>!isDone(t,selectedDate)).reduce((sum,t)=>sum+(+t.duration||0),0))} دقیقه</b><span>زمان تخمینی کارهای باز</span></div></div></div><div class="card"><div class="date-strip"><h2 style="font-size:16px;margin:0">مأموریت‌های روز</h2><div class="date-arrows"><button class="iconbtn" data-step-day="-1" title="روز قبل">‹</button><span class="tag">${shortDate(selectedDate)} · ${dayName(selectedDate)}</span><button class="iconbtn" data-step-day="1" title="روز بعد">›</button><button class="btn btn-ghost" data-go-today>امروز</button></div></div>${todayTasks.length?todayTasks.map(t=>renderTaskRow(t,selectedDate)).join(''):'<div class="task-empty">تسک برنامه‌ریزی‌شده‌ای نداری. می‌توانی یک کار به این روز اضافه کنی.</div>'}<button class="btn" style="margin-top:12px" data-new-date="${selectedDate}">＋ افزودن تسک برای این روز</button></div><div class="card"><div class="section-title"><h2>ددلاین‌های ۷ روز آینده و عقب‌افتاده</h2><button class="tiny" data-view="tasks">همهٔ تسک‌ها ◀</button></div>${due.length?due.slice(0,8).map(t=>`<div class="event ${t.due<selectedDate?'due-alert':''}" style="border-color:var(--orange);cursor:pointer" data-edit="${t.id}"><b>${htmlEscape(t.title)}</b><small>${shortDate(t.due)}</small></div>`).join(''):'<div class="empty-hint">هیچ ددلاین نزدیک یا عقب‌افتاده‌ای ثبت نشده است.</div>'}<div class="empty-hint">تسک‌هایی که هنوز برای روزی برنامه‌ریزی نشده‌اند، در تب «تسک‌ها» باقی می‌مانند.</div></div></div>
<div class="gap"><div class="card"><div class="section-title"><h2>رویدادهای ثابت این روز</h2><span class="tag">${fnum(events.length)} رویداد</span></div>${events.length?events.map(renderEvent).join(''):'<div class="task-empty">این روز کلاس یا قرار ثابتی نداری.</div>'}${overlapAlert(selectedDate).map(a=>`<div class="notice">⚠ ${htmlEscape(a)}؛ زمان رفت‌وآمد را بررسی کن.</div>`).join('')}</div><div class="card"><div class="section-title"><h2>حالت امروزت چطور است؟</h2><span class="tag">ثبت اختیاری</span></div><div class="muted" style="margin-bottom:10px">سطح انرژی</div><div class="mood-buttons">${[1,2,3,4,5].map(i=>`<button data-energy="${i}" class="${mood.energy===i?'selected':''}">${fnum(i)} ${['','خیلی کم','کم','متوسط','خوب','عالی'][i]}</button>`).join('')}</div><div class="divider"></div><div class="muted" style="margin-bottom:10px">حال‌وهوا</div><div class="mood-buttons">${[['calm','آروم'],['ok','معمولی'],['great','سرحال'],['tired','خسته']].map(([id,t])=>`<button class="${mood.mood===id?'selected':''}" data-mood="${id}">${t}</button>`).join('')}</div><div class="empty-hint">انرژی پایین به معنی جریمه یا کاهش XP نیست.</div></div><div class="card"><div class="section-title"><h2>وضعیت هفته</h2><span class="tag purple">Level ${fnum(level())}</span></div>${renderMiniWeekBars()}<button class="btn" style="margin-top:12px" data-view="progress">جزئیات پیشرفت</button></div></div></section>`;
}
function renderMiniWeekBars(){const base=shiftWeek(selectedDate);return Array.from({length:7},(_,i)=>{const date=addDays(base,i),ts=dailyTasks(date),done=countDone(date),pct=ts.length?Math.round(done/ts.length*100):0;return `<div class="barline"><span class="dayname">${SATWEEK[i]}</span><div class="track"><div class="fill" style="width:${pct}%"></div></div><span class="count">${fnum(done)}/${fnum(ts.length)}</span></div>`}).join('')}
function renderPlanner(){const days=Array.from({length:7},(_,i)=>addDays(weekBase,i));return `<div class="card"><div class="section-title"><h2>تقویم هفتگی</h2><div class="date-arrows"><button class="iconbtn" data-step-week="-7">‹</button><span class="tag">${shortDate(days[0])} تا ${shortDate(days[6])}</span><button class="iconbtn" data-step-week="7">›</button><button class="btn btn-ghost" data-reset-week>این هفته</button></div></div><div class="notice neutral">برای تغییر روز یک تسک، روی آن کلیک کن و «روز انجام» را ویرایش کن. زمان ثابت کلاس‌ها و رفت‌وآمدها جداگانه نمایش داده می‌شود.</div><div class="week-grid">${days.map(d=>{const ts=dailyTasks(d),ev=dayEvents(d);return `<div class="day-col ${d===today()?'current':''}"><div class="dayhead"><b>${dayName(d)}</b><small>${shortDate(d)}</small></div>${ev.map(e=>`<div class="calendar-item eventitem" data-edit-event="${e.id}"><small>${formatTime(e.start)}–${formatTime(e.end)}</small>${htmlEscape(e.title)}</div>`).join('')}${ts.map(t=>`<div class="calendar-item ${isDone(t,d)?'doneitem':''}" data-edit="${t.id}"><small>${isDone(t,d)?'✓ ':''}${t.duration?fnum(t.duration)+' دقیقه':'بدون مدت'}</small>${htmlEscape(t.title)}</div>`).join('')}${overlapAlert(d).length?`<div class="tag orange">⚠ فاصلهٔ رویدادها</div>`:''}<button class="add-day" data-new-date="${d}">＋ تسک</button></div>`}).join('')}</div><div class="empty-hint">ساعت دقیق انجام کارهای غیردائمی هنوز قفل نمی‌شود؛ در نسخهٔ بعد می‌توانیم بلوک‌های ساعتی و کشیدن و رهاکردن را اضافه کنیم.</div></div><div class="card" style="margin-top:16px"><div class="rowline"><div><b>قرارها و کلاس‌های هفتگی</b><div class="hint">همهٔ ساعت‌ها قابل ویرایش هستند؛ برای اصلاح، روی کارت رویداد در تقویم بزن.</div></div><button class="btn" data-add-event>＋ رویداد ثابت</button></div></div>`}
function renderTasks(){const total=data.tasks.length,open=data.tasks.filter(t=>t.type==='once'&&!isDone(t)).length;let filtered=data.tasks.filter(t=>{const hit=(t.title+' '+t.notes+' '+t.category).toLowerCase().includes(search.toLowerCase());return hit&&(taskFilter==='all'||(taskFilter==='routine'?t.type!=='once':taskFilter==='project'?t.category==='دانشگاه'||t.category==='دستیار آموزشی':taskFilter==='pending'?t.type==='once'&&!isDone(t):taskFilter==='done'?t.type==='once'&&isDone(t):true))}).sort((a,b)=>(a.type==='once'&&b.type!=='once'?-1:a.type!=='once'&&b.type==='once'?1:0)||(a.due||'9999').localeCompare(b.due||'9999'));

function weekDates(){return Array.from({length:7},(_,i)=>addDays(shiftWeek(selectedDate),i))}

i(v.planned)}" inputmode="numeric">`)}</div><div class="hint">ددلاین و روز انجام مستقل‌اند؛ می‌توانی زودتر از ددلاین برای یک تسک وقت بگذاری.</div></div><div class="form-group full" id="weeklyInputs" style="display:${v.type==='weekly'?'block':'none'}"><label>روزهای تکرار</label><div class="multi-days">${days.map(x=>`<label><input type="checkbox" name="weekday" value="${x.num}" ${v.repeatDays?.includes(x.num)?'checked':''}>${x.day}</label>`).join('')}</div></div>${formField('یادداشت‌ها و جزئیات',`<textarea name="notes" placeholder="مراحل انجام، لینک درس، جزئیات...">${htmlEscape(v.notes)}</textarea>`,true)}<div class="foot full"><button type="button" class="btn btn-ghost" data-close-modal>انصراف</button><button type="submit" class="btn btn-primary">${id?'ذخیرهٔ تغییرات':'افزودن تسک'}</button></div></form></div></div>`;
 document.getElementById('taskType').addEventListener('change',e=>{document.getElementById('dateInputs').style.display=e.target.value==='once'?'block':'none';document.getElementById('weeklyInputs').style.display=e.target.value==='weekly'?'block':'none'});document.getElementById('dateInputs').style.display=v.type==='once'?'block':'none';document.getElementById('taskForm').addEventListener('submit',saveTask);}
function saveTask(e){e.preventDefault();const f=new FormData(e.target);const type=f.get('type'),title=f.get('title').trim();if(!title)return;const due=type==='once'?jalaliToISO(f.get('due')):'',planned=type==='once'?jalaliToISO(f.get('planned')):'';if(due===null||planned===null){toast('فرمت تاریخ شمسی معتبر نیست. نمونه: ۱۴۰۵/۰۸/۰۷');return}const repeatDays=type==='weekly'?f.getAll('weekday').map(Number):[],duration=Math.max(0,Math.min(1440,Number(f.get('duration'))||0));if(type==='weekly'&&!repeatDays.length){toast('برای تسک هفتگی دست‌کم یک روز انتخاب کن');return}const props={title,category:f.get('category')?.trim()||'شخصی',type,duration,priority:f.get('priority'),due,planned,repeatDays,notes:f.get('notes')?.trim()||''};const old=activeModal.id?data.tasks.find(t=>t.id===activeModal.id):null;if(old)Object.assign(old,props);else data.tasks.push(mkTask(title,props.category,type,duration,props));closeModal();store();render();toast(old?'تسک ویرایش شد':'تسک اضافه شد')}
function openEventModal(id=null){const e=id?data.events.find(x=>x.id===id):null;activeModal={type:'event',id};const v=e||mkEvent('',6,'09:00','10:00','personal');document.getElementById('modalRoot').innerHTML=`<div class="modal-wrap" data-close-overlay="1"><div class="modal" role="dialog" aria-modal="true"><div class="section-title"><h2>${id?'ویرایش رویداد ثابت':'افزودن رویداد ثابت'}</h2><button class="tiny" data-close-modal>×</button></div><form id="eventForm" class="form-grid">${formField('عنوان',`<input name="title" required value="${htmlEscape(v.title)}">`,true)}${formField('شروع',`<input name="start" type="time" required value="${v.start}">`)}${formField('پایان',`<input name="end" type="time" required value="${v.end}">`)}${formField('نوع',`<select name="kind"><option value="school" ${v.kind==='school'?'selected':''}>دانشگاه</option><option value="gym" ${v.kind==='gym'?'selected':''}>ورزش</option><option value="personal" ${v.kind==='personal'?'selected':''}>شخصی</option></select>`)}<div class="form-group full"><label>روزهای تکرار</label><div class="multi-days">${SATWEEK.map((day,i)=>({day,num:(i+6)%7})).map(x=>`<label><input name="days" type="checkbox" value="${x.num}" ${v.days.includes(x.num)?'checked':''}>${x.day}</label>`).join('')}</div></div>${formField('یادداشت',`<textarea name="notes">${htmlEscape(v.notes||'')}</textarea>`,true)}<div class="foot full"><button class="btn" type="button" data-close-modal>انصراف</button><button class="btn btn-primary" type="submit">ذخیرهٔ رویداد</button></div></form>${id?`<button class="btn btn-danger" style="margin-top:12px" data-delete-event="${id}">حذف رویداد</button>`:''}</div></div>`;document.getElementById('eventForm').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);const days=f.getAll('days').map(Number);if(!days.length){toast('حداقل یک روز انتخاب کن');return}if(f.get('start')>=f.get('end')){toast('زمان پایان باید بعد از شروع باشد');return}const obj={title:f.get('title').trim(),start:f.get('start'),end:f.get('end'),kind:f.get('kind'),days,notes:f.get('notes')||''};if(id)Object.assign(data.events.find(x=>x.id===id),obj);else data.events.push({...obj,id:uid()});closeModal();store();render();toast('رویداد ذخیره شد')})}
function closeModal(){document.getElementById('modalRoot').innerHTML='';activeModal=null}
let toastTimer;function toast(s){let el=document.getElementById('toast');el.textContent=s;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3800)}
function downloadBackup(){const txt=JSON.stringify({...data,exportedAt:new Date().toISOString()},null,2),blob=new Blob([txt],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='momentum-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function importBackup(file){if(!file)return;try{const str=await file.text(),obj=normalize(JSON.parse(str));if(!confirm('داده‌های فعلی با اطلاعات فایل جایگزین شوند؟ قبلش خروجی پشتیبان بگیر.'))return;data=obj;store();render();toast('پشتیبان بازیابی شد')}catch(e){toast('فایل پشتیبان معتبر نیست') }}
// Cloud optional: secure Supabase Auth + row-level-security, see schema.sql.
function setCloudMsg(msg){const el=document.getElementById('cloudMessage');if(el)el.textContent=msg}
function loadSupabaseSDK(){if(window.supabase?.createClient)return Promise.resolve();return new Promise((resolve,reject)=>{let src=document.createElement('script');src.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';src.onload=()=>window.supabase?.createClient?resolve():reject(Error('Supabase SDK در دسترس نیست'));src.onerror=()=>reject(Error('بارگذاری کتابخانهٔ همگام‌سازی انجام نشد'));document.head.appendChild(src)})}
async function makeCloud(){if(!syncConf.url||!syncConf.key)throw Error('آدرس و کلید پروژه Supabase را در تنظیمات وارد کن');await loadSupabaseSDK();sb=window.supabase.createClient(syncConf.url,syncConf.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});cloud=sb;const {data:{session},error}=await sb.auth.getSession();if(error)throw error;if(session){cloudReady=true;cloudSyncOk=false;await syncLatest();render()}else{cloudReady=false;cloudSyncOk=false;render()}}
function cloudFormCredentials(){
 const email=document.getElementById('sbEmail')?.value.trim();
 const url=document.getElementById('sbUrl')?.value.trim();
 const key=document.getElementById('sbKey')?.value.trim();
 const password=document.getElementById('sbPass')?.value||'';
 if(!email||!url||!key)throw Error('ایمیل، آدرس و کلید پروژه را وارد کن');
 if(password.length<8)throw Error('رمز عبور باید حداقل ۸ کاراکتر باشد');
 if(!/^https:\/\/[-a-zA-Z0-9.]+\.supabase\.co\/?$/.test(url))throw Error('آدرس Supabase معتبر نیست');
 syncConf={url,key,email};localStorage.setItem(CFGKEY,JSON.stringify(syncConf));
 return {email,password};
}
async function cloudSignup(){
 try{const {email,password}=cloudFormCredentials();await makeCloud();
 const {data:result,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:window.location.origin+window.location.pathname}});
 if(error)throw error;
 if(result.session){cloudReady=true;await syncLatest();render();toast('حساب ساخته شد و ورود انجام شد');}
 else{setCloudMsg('ثبت‌نام ارسال شد. ایمیل تأیید را باز کن؛ سپس با همین ایمیل و رمز عبور وارد شو.');toast('ایمیل تأیید ثبت‌نام را بررسی کن');}
 }catch(e){setCloudMsg(e.message||'خطای ثبت‌نام');toast(e.message||'خطای ثبت‌نام')}
}
async function cloudLogin(){
 try{const {email,password}=cloudFormCredentials();await makeCloud();
 const {error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;
 cloudReady=true;await syncLatest();render();toast('ورود انجام شد');
 }catch(e){setCloudMsg(e.message||'خطای ورود');toast(e.message||'خطای ورود')}
}
async function saveCloudSettings(){try{syncConf={url:document.getElementById('sbUrl').value.trim(),key:document.getElementById('sbKey').value.trim(),email:document.getElementById('sbEmail').value.trim()};if(!/^https:\/\/[-a-zA-Z0-9.]+\.supabase\.co\/?$/.test(syncConf.url))throw Error('آدرس Supabase باید به supabase.co ختم شود');if(!syncConf.key)throw Error('کلید پروژه خالی است');localStorage.setItem(CFGKEY,JSON.stringify(syncConf));await makeCloud();toast(cloudReady?'اتصال ابری فعال شد':'تنظیمات ذخیره شد؛ با ایمیل وارد شو')}catch(e){toast(e.message||'تنظیمات معتبر نیست');setCloudMsg(e.message||'خطا')}}
async function syncLatest(){if(!sb||!cloudReady||busySync)return;busySync=true;try{const {data:{user},error:ue}=await sb.auth.getUser();if(ue||!user)throw ue||Error('ابتدا وارد حساب شو');const {data:row,error}=await sb.from('momentum_data').select('payload').eq('id',user.id).maybeSingle();if(error)throw error;const remote=row?.payload?normalize(row.payload):null;
if(remote&&(data.pristine||remote.lastModified>data.lastModified)){data=remote;localStorage.setItem(DBKEY,JSON.stringify(data));render();toast('اطلاعات جدید از ابر دریافت شد')}else if(!remote||data.lastModified>remote.lastModified){const {error:se}=await sb.from('momentum_data').upsert({id:user.id,payload:data},{onConflict:'id'});if(se)throw se}
cloudSyncOk=true;refreshStorageBadge();setCloudMsg('اطلاعات با ابر همگام شدند.');}catch(e){cloudSyncOk=false;refreshStorageBadge();console.error(e);setCloudMsg('خطای همگام‌سازی: '+(e.message||e));toast('همگام‌سازی ناموفق؛ اطلاعات روی این دستگاه محفوظ است')}finally{busySync=false}}
function scheduleUpload(){clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncLatest(),1300)}
async function cloudLogout(){if(sb)await sb.auth.signOut();cloudReady=false;sb=null;cloud=null;render();toast('از حساب ابری خارج شدی. دادهٔ محلی باقی مانده است.')}
function onClick(e){const n=e.target.closest('[data-view],[data-edit],[data-del],[data-toggle],[data-step-day],[data-step-week],[data-go-today],[data-reset-week],[data-new-date],[data-new-task],[data-filter],[data-energy],[data-mood],[data-close-modal],[data-close-overlay],[data-theme],[data-add-event],[data-edit-event],[data-delete-event],[data-export],[data-import],[data-reset],[data-cloud-save],[data-cloud-signup],[data-cloud-login],[data-cloud-pull],[data-cloud-logout]');if(!n)return;const d=n.dataset;
if(d.closeOverlay&&e.target!==n)return;
if(d.view){view=d.view;render();window.scrollTo({top:0,behavior:'smooth'});return}
if(d.edit){openTaskModal(d.edit);return}
if(d.del){const t=data.tasks.find(x=>x.id===d.del);if(t&&confirm(`«${t.title}» حذف شود؟`)){data.tasks=data.tasks.filter(x=>x.id!==d.del);for(const k of Object.keys(data.completions))if(k.startsWith(d.del+'|'))delete data.completions[k];store();render();toast('تسک حذف شد')}return}
if(d.stepDay){selectedDate=addDays(selectedDate,Number(d.stepDay));weekBase=shiftWeek(selectedDate);render();return}
if(d.stepWeek){weekBase=addDays(weekBase,Number(d.stepWeek));render();return}
if('goToday' in d){selectedDate=today();weekBase=shiftWeek(today());render();return}
if('resetWeek' in d){weekBase=shiftWeek(today());render();return}
if(d.newDate){openTaskModal(null,d.newDate);return}
if('newTask' in d){openTaskModal();return}
if(d.filter){taskFilter=d.filter;render();return}
if(d.energy){data.checkins[selectedDate]={...data.checkins[selectedDate],energy:Number(d.energy)};store();render();return}
if(d.mood){data.checkins[selectedDate]={...data.checkins[selectedDate],mood:d.mood};store();render();return}
if('closeModal' in d||'closeOverlay' in d){closeModal();return}
if(d.theme){data.theme=d.theme;store();render();return}
if('addEvent' in d){openEventModal();return}
if(d.editEvent){openEventModal(d.editEvent);return}
if(d.deleteEvent){if(confirm('این رویداد هفتگی حذف شود؟')){data.events=data.events.filter(x=>x.id!==d.deleteEvent);closeModal();store();render()}return}
if('export' in d){downloadBackup();return}
if('import' in d){document.getElementById('importFile')?.click();return}
if('reset' in d){if(confirm('تمام داده‌ها و پیشرفت‌ها حذف و برنامه به نسخهٔ اولیه برگردد؟')){data=defaultData();store();render();toast('داده‌ها بازنشانی شدند')}return}
if('cloudSave' in d){saveCloudSettings();return}
if('cloudSignup' in d){cloudSignup();return}
if('cloudLogin' in d){cloudLogin();return}
if('cloudPull' in d){syncLatest();return}
if('cloudLogout' in d){cloudLogout();return}
}
document.addEventListener('click',onClick);
document.addEventListener('change',e=>{const n=e.target;if(n.matches('[data-toggle]')){const t=data.tasks.find(t=>t.id===n.dataset.toggle);if(t)setDone(t,n.dataset.date,n.checked)}if(n.id==='importFile')importBackup(n.files?.[0]);});
document.addEventListener('input',e=>{if(e.target.id==='taskSearch'){const start=e.target.selectionStart;search=e.target.value;const list=document.getElementById('taskList');if(list){const tmp=document.createElement('div');tmp.innerHTML=renderTasks();list.innerHTML=tmp.querySelector('#taskList')?.innerHTML||'';}}});
document.getElementById('quickAdd').addEventListener('click',()=>openTaskModal());
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
render();
if(syncConf.url&&syncConf.key)makeCloud().catch(err=>{console.warn('cloud unavailable',err)});
window.addEventListener('focus',()=>{if(cloudReady)syncLatest()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cloudReady)syncLatest()});
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
